<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abu Iqbal POS</title>
<meta name="description" content="Sistem kasir dan inventori Abu Iqbal.">
<meta name="theme-color" content="#17150F">
<meta property="og:title" content="Abu Iqbal POS"><meta property="og:description" content="Sistem kasir dan inventori Abu Iqbal.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#FFF8E7;--bg2:#FFE9A8;--card:#fff;--ink:#1B1608;--mut:#7a7058;--y:#F5B800;--y2:#FFD84D;--yd:#B98A00;--ln:#F0E4BE;--ok:#16A05B;--er:#D93A2F;--sh:0 8px 24px rgba(120,90,0,.10);--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110a;--bg2:#2a2108;--card:#201c11;--ink:#f8f0d8;--mut:#b0a68a;--ln:#3a3320;--ok:#4cc58a;--er:#ff8a80;--sh:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(900px 420px at 100% -8%,var(--bg2),transparent 70%),radial-gradient(700px 400px at -10% 110%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav{width:236px;background:linear-gradient(185deg,#1B1608 0%,#2d2410 100%);color:#FBF6E9;padding:22px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;box-shadow:6px 0 30px rgba(0,0,0,.15)}
nav h1{font-size:23px;margin:2px 10px 22px;letter-spacing:.3px;font-weight:800}nav h1 span{background:linear-gradient(90deg,var(--y),var(--y2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{background:none;border:0;color:#d8d0b8;text-align:left;padding:11px 13px;border-radius:14px;cursor:pointer;min-height:46px;display:flex;align-items:center;gap:11px;transition:.18s}
nav button .ic{font-size:18px;width:26px;text-align:center}
nav button.on{background:linear-gradient(90deg,var(--y),var(--y2));color:#1B1608;font-weight:800;box-shadow:0 6px 16px rgba(245,184,0,.35)}nav button:hover:not(.on){background:#3a3017;transform:translateX(3px)}
main{flex:1;padding:26px;min-width:0;max-width:1240px;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.top h2{margin:0;flex:1;font-size:27px;font-weight:800;letter-spacing:-.3px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 24px;border-radius:var(--r);margin-bottom:16px;color:#fff8e0;background:linear-gradient(120deg,#1B1608,#3b2e10 60%,#6b4f06);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,0,.55),transparent 70%)}
.hero h3{margin:2px 0 0;font-size:24px}.hero small{opacity:.75}.hero>div:last-child{z-index:1;background:#ffffff1a;padding:8px 14px;border-radius:99px;font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.m{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:.2s;position:relative;overflow:hidden}
.m:hover{transform:translateY(-3px)}.m:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--y),var(--y2))}
.m small{color:var(--mut);display:block;font-size:12.5px}.m b{font-size:21px;font-weight:800}
.grid .m:first-child{background:linear-gradient(135deg,var(--y),var(--y2));border:0;color:#1B1608}.grid .m:first-child small{color:#4d3c00}.grid .m:first-child:before{display:none}
.btn{background:linear-gradient(135deg,var(--y),var(--y2));color:#1B1608;border:0;border-radius:99px;padding:10px 20px;font-weight:800;cursor:pointer;min-height:44px;box-shadow:0 5px 14px rgba(245,184,0,.35);transition:.18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(245,184,0,.45)}.btn:active{transform:none}
.btn.g{background:transparent;border:1px solid var(--ln);color:var(--ink);font-weight:600;box-shadow:none}.btn.g:hover{background:var(--ln)}
.btn.r{background:var(--er);color:#fff;box-shadow:none}.btn:disabled{opacity:.5;transform:none}.btn.s{padding:6px 13px;min-height:34px;font-size:13px}
input,select,textarea{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;transition:.15s}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px;border-color:var(--y)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 0 5px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;background:var(--card);z-index:1}
tr:hover td{background:rgba(245,184,0,.08)}
.sc{overflow:auto;max-height:78vh}.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--y),var(--y2));color:#1B1608}
.badge.v{background:var(--er);color:#fff}.badge.o{background:var(--ok);color:#fff}.badge.n{background:var(--ln);color:var(--ink)}
.pos{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}#cart{position:sticky;top:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:12px}
.p{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:.2s}.p:hover{transform:translateY(-4px);border-color:var(--y)}
.p b{display:block;margin:2px 0 4px;font-size:16px}.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--y),var(--y2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#1B1608;margin-bottom:8px}
.sz{display:flex;gap:6px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}.tot{font-size:24px;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:linear-gradient(var(--y2),var(--y));border-radius:8px 8px 2px 2px;min-height:4px;transition:.3s}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:var(--card);border-radius:22px;padding:22px;max-width:480px;width:100%;max-height:92vh;overflow:auto;animation:pop .2s;box-shadow:0 20px 60px #0008}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:13px 22px;border-radius:99px;color:#fff;z-index:30;display:none;font-weight:700;box-shadow:0 10px 30px #0005}
.login{max-width:410px;margin:9vh auto;padding:0 16px;animation:pop .4s}.login h1{font-size:40px;font-weight:800;margin:0}.login h1 span{background:linear-gradient(90deg,var(--yd),var(--y));-webkit-background-clip:text;background-clip:text;color:transparent}
.login .card{padding:24px;border-radius:24px}.lg{display:block;width:90px;height:auto;margin:8px 0 12px}nav .lgn{display:block;width:72px;height:auto;margin:0 10px 16px}.err{color:var(--er);font-size:13px;margin-top:6px}.mut{color:var(--mut)}
@media(max-width:820px){.app{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:10px;position:sticky;top:0;z-index:5;gap:4px}nav h1,nav .lgn{display:none}nav button{white-space:nowrap;min-height:42px;padding:8px 13px}nav button:hover:not(.on){transform:none}.pos{grid-template-columns:1fr}#cart{position:static}main{padding:14px}.top h2{font-size:22px}}
@media print{nav,.top,.noprint{display:none!important}.ov{position:static;background:none}}
</style>

const KEY='abuiqbal_pos_v1';
function seed(){return{ing:[],loc:[{id:'L1',n:'Toko Utama'}],bal:{L1:{}},prod:[],mv:[],sales:[],pur:[],tr:[],exp:[],aud:[],set:{lim:10,neg:0},n:0,users:[],shifts:[]}}
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=D||seed();D.shifts=D.shifts||[];if(!D.users)D.users=seed().users;D.prod.forEach(p=>{p.u=p.u||'ml';if(!p.ppm)p.ppm=p.sz?Math.round(p.sz[0].p/p.sz[0].ml):0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
async function hs(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const myLocs=()=>U.role=='owner'?D.loc:D.loc.filter(l=>U.locs.includes(l.id));
let U=null,loc='L1',pg='dash',cart=[],q='',disc={t:'%',v:0},R={f:ld().slice(0,8)+'01',t:ld(),d:'all',l:'all'};
const owner=()=>U.role==='owner',ing=id=>D.ing.find(i=>i.id==id)||{id,n:'(bahan dihapus)',u:'',min:0,c:0},lname=id=>(D.loc.find(l=>l.id==id)||{n:'(cabang dihapus)'}).n,bal=(l,i)=>(D.bal[l]||{})[i]||0;
function toast(m,ok=1){const t=$('#toast');t.textContent=m;t.style.background=ok?'#1d7a46':'#b3261e';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}

<hr style="border:0;border-top:1px solid var(--ln)"><div class="f" style="grid-template-columns:90px 1fr"><div><label for="dt">Diskon</label><select id="dt" onchange="disc.t=this.value;$('#cart').innerHTML=cartH()"><option ${disc.t=='%'?'selected':''}>%</option><option ${disc.t=='Rp'?'selected':''} value="Rp">Rp</option></select></div><div><label for="dvv">Nilai</label><input id="dvv" type="number" min="0" value="${disc.v}" onchange="disc.v=Math.max(0,+this.value||0);$('#cart').innerHTML=cartH()"></div></div>

busy=1;const id='TRX-'+ld().replace(/-/g,'')+'-'+String(++D.n).padStart(4,'0'),hpp=keys.reduce((a,k)=>a+us[k]*ing(k).c,0);

function addProd(){const n=V('pn').trim(),pp=N('pm1'),cm=N('pcs1'),pc=V('pt')=='pcs';if(!n)return $('#pe').textContent='Nama produk wajib diisi.';if(pp<=0)return $('#pe').textContent='Harga jual harus lebih dari 0.';if(cm<0||V('pcs1')==='')return $('#pe').textContent='Isi harga modal (boleh 0).';const b='I'+Date.now();D.ing.push({id:b,n,u:pc?'pcs':'ml',min:pc?5:50,c:cm});D.loc.forEach(l=>{D.bal[l.id]=D.bal[l.id]||{};D.bal[l.id][b]=0});D.prod.push({id:'P'+Date.now(),n,cat:pc?'Barang':'Bibit',b,on:1,u:pc?'pcs':'ml',ppm:pp});aud('Tambah produk',n);render();toast('Produk disimpan. Tambah stok lewat menu Inventori (tombol Atur stok).')}
function editPpm(id){const p=D.prod.find(x=>x.id==id);modal(`<h3>Harga — ${p.n}</h3><label for="np">Harga baru (Rp / ${p.u=='pcs'?'pcs':'ml'})</label><input id="np" class="rp" type="text" inputmode="numeric" oninput="fm(this)" value="${nf(p.ppm)}"><div id="npe" class="err"></div><br><button class="btn" onclick="savePpm('${id}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function savePpm(id){const p=D.prod.find(x=>x.id==id),v=N('np');if(v<=0)return $('#npe').textContent='Harga harus lebih dari 0.';aud('Ubah harga/ml',p.n+': '+p.ppm+' → '+v);p.ppm=v;close();render();toast('Harga diperbarui')}
function togProd(id){const p=D.prod.find(x=>x.id==id);p.on=p.on?0:1;aud('Ubah status produk',p.n);render()}

/* ---------- Inventori ---------- */
function inv(){const mv_=D.mv.filter(m=>m.l==loc).slice(0,40);
return `<div class="card sc"><table><tr><th>Bahan</th><th>Saldo</th><th>Min</th><th>Status</th><th>HPP/unit</th>${owner()?'<th>Stok opname</th>':''}</tr>${D.ing.map(i=>{const b=bal(loc,i.id);return `<tr><td>${i.n}</td><td><b>${nq(b)}</b> ${i.u}</td><td>${nq(i.min)}</td><td>${b<=i.min?'<span class="badge v">Menipis</span>':'<span class="badge o">Aman</span>'}</td><td>${owner()?rp(i.c):'-'}</td>${owner()?`<td><button class="btn g s" onclick="opname('${i.id}')">Atur stok</button></td>`:''}</tr>`}).join('')}</table></div>
<div class="card"><b>Catat pemakaian bahan (di luar transaksi)</b><div class="f"><div><label for="ui">Bahan</label><select id="ui">${D.ing.map(i=>`<option value="${i.id}">${i.n} (${i.u})</option>`).join('')}</select></div><div><label for="uq">Jumlah</label><input id="uq" type="number" min="0" step="any"></div><div><label for="ur">Alasan</label><input id="ur" placeholder="mis. sampel/tester"></div><button class="btn" onclick="manUse()">Catat</button></div><div id="ie" class="err"></div></div>
<div class="card sc"><b>Riwayat pergerakan stok — ${lname(loc)} (40 terakhir)</b><table><tr><th>Waktu</th><th>Bahan</th><th>Jumlah</th><th>Jenis</th><th>Alasan</th><th>User</th><th>Ref</th></tr>${mv_.length?mv_.map(m=>`<tr><td>${dt(m.t)}</td><td>${ing(m.i).n}</td><td style="color:var(${m.q<0?'--er':'--ok'})">${m.q>0?'+':''}${nq(m.q)}</td><td>${m.type}</td><td>${esc(m.reason)}</td><td>${esc(m.u)}</td><td>${m.ref}</td></tr>`).join(''):'<tr><td colspan="7" class="mut">Belum ada pergerakan.</td></tr>'}</table></div>`}
function manUse(){const i=V('ui'),qn=N('uq');if(qn<=0)return $('#ie').textContent='Jumlah harus lebih dari 0.';if(!V('ur').trim())return $('#ie').textContent='Alasan wajib diisi.';if(!D.set.neg&&bal(loc,i)<qn)return $('#ie').textContent='Stok tidak cukup.';mv(loc,i,-qn,'Pemakaian',V('ur'));aud('Pemakaian manual',ing(i).n+' '+qn,V('ur'));render();toast('Tercatat')}
function opname(id){const i=ing(id);modal(`<h3>Stok opname — ${i.n}</h3><p>Stok sistem: <b>${nq(bal(loc,id))} ${i.u}</b></p><label for="ph">Stok fisik</label><input id="ph" type="number" min="0" step="any"><br><br><label for="pr">Alasan selisih (wajib)</label><input id="pr"><div id="oe" class="err"></div><br><button class="btn" onclick="doOp('${id}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doOp(id){const f=N('ph'),r=V('pr').trim();if(V('ph')===''||f<0)return $('#oe').textContent='Isi stok fisik yang valid.';if(!r)return $('#oe').textContent='Alasan wajib diisi.';const d=f-bal(loc,id);if(d)mv(loc,id,d,'Koreksi',r);aud('Stok opname',ing(id).n+' selisih '+d,r);close();render();toast('Stok dikoreksi')}

/* ---------- Pembelian ---------- */
function pur(){return `<div class="card"><b>Penerimaan pembelian baru</b><div class="f"><div><label for="pi">Bahan</label><select id="pi">${D.ing.map(i=>`<option value="${i.id}">${i.n} (${i.u})</option>`).join('')}</select></div><div><label for="pq">Jumlah</label><input id="pq" type="number" min="0" step="any"></div><div><label for="pp">Harga beli / unit</label><input id="pp" type="number" min="0"></div><div><label for="px">Biaya tambahan</label><input id="px" type="number" min="0" value="0"></div><div><label for="ps">Pemasok</label><input id="ps"></div><button class="btn" onclick="doPur()">Terima &amp; tambah stok</button></div><div id="pue" class="err"></div><p class="mut">HPP memakai rata-rata tertimbang (usulan PRD). Transaksi lama tidak berubah.</p></div>
<div class="card sc"><table><tr><th>Tanggal</th><th>Pemasok</th><th>Bahan</th><th>Jumlah</th><th>Total</th><th>Status</th></tr>${D.pur.slice(0,30).map(p=>`<tr><td>${dt(p.t)}</td><td>${esc(p.s)}</td><td>${ing(p.i).n}</td><td>${p.q}</td><td>${rp(p.tot)}</td><td><span class="badge o">${p.st}</span></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada pembelian.</td></tr>'}</table></div>`}
function doPur(){const i=V('pi'),qn=N('pq'),pr=N('pp'),x=N('px');if(qn<=0||pr<=0||x<0)return $('#pue').textContent='Jumlah dan harga harus lebih dari 0.';const I=ing(i),tot=D.loc.reduce((a,l)=>a+Math.max(0,bal(l.id,i)),0),nc=(tot*I.c+qn*pr+x)/(tot+qn);I.c=nc;mv(loc,i,qn,'Pembelian','Penerimaan pembelian');D.pur.unshift({t:Date.now(),l:loc,s:V('ps')||'-',i,q:qn,tot:qn*pr+x,st:'Diterima'});aud('Pembelian',I.n+' '+qn);render();toast('Stok bertambah')}

/* ---------- Transfer ---------- */
function tr(){const o=D.loc.filter(l=>l.id!=loc)[0];return `<div class="card"><b>Kirim stok dari ${lname(loc)}</b><div class="f"><div><label for="tt">Ke lokasi</label><select id="tt">${D.loc.filter(l=>l.id!=loc).map(l=>`<option value="${l.id}">${l.n}</option>`).join('')}</select></div><div><label for="ti">Bahan</label><select id="ti">${D.ing.map(i=>`<option value="${i.id}">${i.n}</option>`).join('')}</select></div><div><label for="tq">Jumlah</label><input id="tq" type="number" min="0" step="any"></div><button class="btn" onclick="doTr()">Kirim</button></div><div id="te" class="err"></div></div>
<div class="card sc"><table><tr><th>Waktu</th><th>Dari</th><th>Ke</th><th>Bahan</th><th>Jumlah</th><th>Status</th><th></th></tr>${D.tr.slice(0,30).map(t=>`<tr><td>${dt(t.t)}</td><td>${lname(t.f)}</td><td>${lname(t.to)}</td><td>${ing(t.i).n}</td><td>${t.q}</td><td><span class="badge ${t.st=='Diterima'?'o':''}">${t.st}</span></td><td>${t.st=='Dikirim'?`<button class="btn s" onclick="recv('${t.id}')">Konfirmasi terima</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Belum ada transfer.</td></tr>'}</table></div>`}
function doTr(){const i=V('ti'),qn=N('tq');if(qn<=0)return $('#te').textContent='Jumlah harus lebih dari 0.';if(bal(loc,i)<qn)return $('#te').textContent='Stok asal tidak cukup.';const id='T'+Date.now();mv(loc,i,-qn,'Transfer keluar','Ke '+lname(V('tt')),id);D.tr.unshift({id,t:Date.now(),f:loc,to:V('tt'),i,q:qn,st:'Dikirim'});aud('Transfer kirim',ing(i).n+' '+qn);render();toast('Transfer dikirim')}
function recv(id){const t=D.tr.find(x=>x.id==id);if(t.st!='Dikirim')return;t.st='Diterima';mv(t.to,t.i,t.q,'Transfer masuk','Dari '+lname(t.f),id);aud('Transfer terima',id);render();toast('Stok diterima')}

/* ---------- Pengeluaran ---------- */
function exp(){return `<div class="card"><b>Catat pengeluaran — ${lname(loc)}</b><div class="f"><div><label for="ec">Kategori</label><select id="ec"><option>Sewa</option><option>Listrik</option><option>Transportasi</option><option>Perlengkapan</option><option>Lainnya</option></select></div><div><label for="ea">Nominal</label><input id="ea" class="rp" type="text" inputmode="numeric" oninput="fm(this)"></div><div><label for="ed">Tanggal</label><input id="ed" type="date" value="${ld()}"></div><div><label for="en">Alasan (wajib)</label><input id="en" placeholder="mis. beli plastik pembungkus"></div><button class="btn" onclick="doExp()">Simpan</button></div><div id="ee" class="err"></div></div>
<div class="card sc"><table><tr><th>Tanggal</th><th>Lokasi</th><th>Kategori</th><th>Nominal</th><th>Alasan</th><th>Dicatat oleh</th></tr>${D.exp.filter(e=>owner()||e.u==U.n).slice(0,40).map(e=>`<tr><td>${e.d}</td><td>${lname(e.l)}</td><td>${e.c}</td><td>${rp(e.a)}</td><td>${esc(e.n)}</td><td>${esc(e.u||'-')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada pengeluaran.</td></tr>'}</table></div>`}
function doExp(){const a=N('ea');if(a<=0||!V('ed'))return $('#ee').textContent='Nominal harus > 0 dan tanggal wajib diisi.';if(!V('en').trim())return $('#ee').textContent='Alasan pengeluaran wajib diisi.';D.exp.unshift({t:Date.now(),d:V('ed'),l:loc,c:V('ec'),a,n:V('en').trim(),u:U.n});aud('Pengeluaran',V('ec')+' '+a,V('en').trim());D.exp.sort((x,y)=>y.d.localeCompare(x.d));render();toast('Tersimpan')}

/* ---------- Laporan ---------- */
function rep(){const L=D.sales.filter(x=>inR(x,R.f,R.t,R.l)&&(R.d=='all'||(R.d=='y'?x.disc>0:x.disc==0))),c=calc(L),ex=D.exp.filter(e=>e.d>=R.f&&e.d<=R.t&&(R.l=='all'||e.l==R.l)).reduce((s,e)=>s+e.a,0),pm={};L.filter(ok).forEach(x=>pm[x.pm]=(pm[x.pm]||0)+x.net);
return `<div class="card"><div class="f"><div><label for="rf">Dari</label><input id="rf" type="date" value="${R.f}" onchange="R.f=this.value;render()"></div><div><label for="rt">Sampai</label><input id="rt" type="date" value="${R.t}" onchange="R.t=this.value;render()"></div><div><label>Lokasi</label>${lsel(1)}</div><div><label for="rd">Status diskon</label><select id="rd" onchange="R.d=this.value;render()"><option value="all">Semua transaksi</option><option value="y" ${R.d=='y'?'selected':''}>Berdiskon</option><option value="n" ${R.d=='n'?'selected':''}>Tanpa diskon</option></select></div><button class="btn g" onclick="csv()">Ekspor CSV</button></div></div>
<p class="mut">Periode ${R.f} s/d ${R.t} • ${R.l=='all'?'Semua lokasi':lname(R.l)} • Transaksi void tidak dihitung</p><div class="grid">
<div class="m"><small>Omzet kotor</small><b>${rp(c.g)}</b></div><div class="m"><small>Total diskon (${c.dn} dari ${c.n} trx${c.n?', '+Math.round(c.dn/c.n*100)+'%':''})</small><b>${rp(c.d)}</b></div><div class="m"><small>Penjualan bersih</small><b>${rp(c.net)}</b></div><div class="m"><small>HPP</small><b>${rp(c.h)}</b></div><div class="m"><small>Laba kotor</small><b>${rp(c.gp)}</b></div><div class="m"><small>Pengeluaran operasional</small><b>${rp(ex)}</b></div><div class="m"><small>Laba bersih operasional</small><b>${rp(c.gp-ex)}</b></div>${Object.keys(pm).map(k=>`<div class="m"><small>Pembayaran ${k}</small><b>${rp(pm[k])}</b></div>`).join('')}</div>
<div class="card sc"><table><tr><th>No. transaksi</th><th>Waktu</th><th>Lokasi</th><th>Kasir</th><th>Bayar</th><th>Sebelum diskon</th><th>Diskon</th><th>Bersih</th><th>HPP</th><th>Status</th><th></th></tr>${L.map(s=>`<tr><td>${s.id}</td><td>${dt(s.t)}</td><td>${lname(s.l)}</td><td>${esc(s.u)}</td><td>${s.pm}</td><td>${rp(s.gross)}</td><td>${s.disc?`<span class="badge">DISKON</span> ${rp(s.disc)}`:'-'}</td><td>${rp(s.net)}</td><td>${rp(s.hpp)}</td><td><span class="badge ${ok(s)?'o':'v'}">${s.status}</span></td><td><button class="btn g s" onclick="receipt(D.sales.find(x=>x.id=='${s.id}'))">Struk</button> ${ok(s)?`<button class="btn r s" onclick="voidS('${s.id}')">Void</button>`:''}</td></tr>`).join('')||'<tr><td colspan="11" class="mut">Tidak ada transaksi pada filter ini.</td></tr>'}</table></div>
<div class="card sc"><b>Riwayat kas toko (buka &amp; tutup)</b><table><tr><th>Dibuka</th><th>Ditutup</th><th>Cabang</th><th>Dibuka oleh</th><th>Uang awal (titip)</th><th>Seharusnya</th><th>Uang fisik</th><th>Selisih</th><th>Catatan</th></tr>${(D.shifts||[]).filter(s=>(R.l=='all'||s.l==R.l)&&inR({t:s.o,l:s.l},R.f,R.t,'all')).map(s=>`<tr><td>${dt(s.o)}</td><td>${s.c?dt(s.c):'<span class="badge o">Sedang buka</span>'}</td><td>${lname(s.l)}</td><td>${esc(s.u)}</td><td>${rp(s.a)}</td><td>${s.c?rp(s.e):'-'}</td><td>${s.c?rp(s.f):'-'}</td><td>${s.c?`<b style="color:var(${s.f==s.e?'--ok':'--er'})">${rp(s.f-s.e)}</b>`:'-'}</td><td>${esc(s.n||'')}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">Belum ada data kas toko pada periode ini.</td></tr>'}</table></div>`}
function voidS(id){modal(`<h3>Void ${id}</h3><p>Stok pemakaian akan dikembalikan dan transaksi tidak dihitung di laporan. Tindakan ini tercatat.</p><label for="vr">Alasan (wajib)</label><input id="vr"><div id="ve" class="err"></div><br><button class="btn r" onclick="doVoid('${id}')">Void transaksi</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doVoid(id){const r=V('vr').trim();if(!r)return $('#ve').textContent='Alasan wajib diisi.';const s=D.sales.find(x=>x.id==id);if(!ok(s))return;s.status='Void';Object.keys(s.use).forEach(k=>mv(s.l,k,s.use[k],'Reversal','Void '+id,id));aud('Void',id,r);close();render();toast('Transaksi di-void')}
function csv(){const L=D.sales.filter(x=>inR(x,R.f,R.t,R.l)),r=[['No','Waktu','Lokasi','Kasir','Bayar','Gross','Diskon','Net','HPP','Status'],...L.map(s=>[s.id,new Date(s.t).toISOString(),lname(s.l),s.u,s.pm,s.gross,s.disc,s.net,s.hpp,s.status])];const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.map(x=>x.join(',')).join('\n'));a.download='laporan-abu-iqbal.csv';a.click()}

/* ---------- Pengaturan ---------- */
const lchk=(s=[])=>D.loc.map(l=>`<label style="display:inline-flex;gap:6px;align-items:center;margin-right:12px;color:var(--ink)"><input type="checkbox" class="lc" value="${l.id}" style="width:auto;min-height:0" ${s.includes(l.id)?'checked':''}>${l.n}</label>`).join(''),sel=s=>[...document.querySelectorAll(s+' .lc:checked')].map(c=>c.value);
function usersH(){return `<div class="card"><b>Cabang</b><div class="f"><div><label for="ln">Nama cabang baru</label><input id="ln"></div><button class="btn" onclick="addLoc()">Tambah cabang</button></div><div id="lerr" class="err"></div><table>${D.loc.map(l=>`<tr><td>${esc(l.n)}</td><td><button class="btn g s" onclick="renLoc('${l.id}')">Ubah nama</button> ${D.loc.length>1?`<button class="btn r s" onclick="delLoc('${l.id}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div>
<div class="card sc"><b>Akun pengguna</b><div class="f"><div><label for="an">Nama</label><input id="an"></div><div><label for="au">Username</label><input id="au" autocomplete="off"></div><div><label for="ap">Kata sandi (min. 6)</label><input id="ap" type="password" autocomplete="new-password"></div><div><label for="ar">Peran</label><select id="ar"><option value="staff">Staff / Kasir</option><option value="owner">Owner</option></select></div></div><p id="lcf"><label>Cabang yang boleh diakses (untuk staff)</label>${lchk()}</p><button class="btn" onclick="addUser()">Tambah akun</button><div id="aerr" class="err"></div>
<table style="margin-top:12px"><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Cabang</th><th></th></tr>${D.users.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.u)}</td><td>${x.role=='owner'?'Owner':'Staff'}</td><td>${x.role=='owner'?'Semua':x.locs.map(l=>lname(l)).join(', ')||'<span class="badge v">Belum ada</span>'}</td><td>${x.role=='staff'?`<button class="btn g s" onclick="editLocs('${x.u}')">Atur cabang</button> `:''}<button class="btn g s" onclick="resetPw('${x.u}')">Reset sandi</button>${x.u!=U.u?` <button class="btn r s" onclick="delUser('${x.u}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div>`}
function addLoc(){const n=V('ln').trim();if(!n)return $('#lerr').textContent='Nama cabang wajib diisi.';if(D.loc.some(l=>l.n.toLowerCase()==n.toLowerCase()))return $('#lerr').textContent='Nama cabang sudah ada.';const id='L'+Date.now();D.loc.push({id,n});D.bal[id]={};aud('Tambah cabang',n);render();toast('Cabang ditambahkan')}
async function addUser(){const e=m=>{$('#aerr').textContent=m},n=V('an').trim(),u=V('au').trim().toLowerCase(),p=V('ap'),r=V('ar'),l=sel('#lcf');if(!n||!u)return e('Nama dan username wajib diisi.');if(!/^[a-z0-9._]+$/.test(u))return e('Username hanya huruf kecil, angka, titik, atau garis bawah.');if(p.length<6)return e('Kata sandi minimal 6 karakter.');if(D.users.some(x=>x.u==u))return e('Username sudah dipakai.');if(r=='staff'&&!l.length)return e('Pilih minimal satu cabang untuk staff.');D.users.push({u,n,role:r,locs:r=='staff'?l:[],ph:await hs(p)});aud('Tambah akun',u+' ('+r+')');render();toast('Akun ditambahkan')}
function editLocs(u){const x=D.users.find(z=>z.u==u);modal(`<h3>Cabang untuk ${esc(x.n)}</h3><p>${lchk(x.locs)}</p><div id="me" class="err"></div><button class="btn" onclick="saveLocs('${u}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function saveLocs(u){const l=sel('#mo');if(!l.length)return $('#me').textContent='Pilih minimal satu cabang.';D.users.find(z=>z.u==u).locs=l;aud('Ubah cabang akun',u,l.map(x=>lname(x)).join(', '));close();render();toast('Cabang diperbarui')}
function resetPw(u){modal(`<h3>Reset sandi ${esc(u)}</h3><label for="np2">Kata sandi baru (min. 6)</label><input id="np2" type="password" autocomplete="new-password"><div id="me" class="err"></div><br><button class="btn" onclick="savePw('${u}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
async function savePw(u){const p=V('np2');if(p.length<6)return $('#me').textContent='Minimal 6 karakter.';D.users.find(z=>z.u==u).ph=await hs(p);aud('Reset sandi',u);close();save();toast('Kata sandi diganti')}
function delUser(u){modal(`<h3>Hapus akun ${esc(u)}?</h3><p>Riwayat transaksinya tetap tersimpan.</p><button class="btn r" onclick="D.users=D.users.filter(z=>z.u!='${u}');aud('Hapus akun','${u}');close();render();toast('Akun dihapus')">Hapus</button> <button class="btn g" onclick="close()">Batal</button>`)}
function renLoc(id){const l=D.loc.find(x=>x.id==id);modal(`<h3>Ubah nama cabang</h3><label for="rn">Nama cabang</label><input id="rn" value="${esc(l.n)}"><div id="rne" class="err"></div><br><button class="btn" onclick="saveLocName('${id}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function saveLocName(id){const n=V('rn').trim();if(!n)return $('#rne').textContent='Nama wajib diisi.';if(D.loc.some(x=>x.id!=id&&x.n.toLowerCase()==n.toLowerCase()))return $('#rne').textContent='Nama sudah dipakai.';D.loc.find(x=>x.id==id).n=n;aud('Ubah nama cabang',n);close();render();toast('Nama cabang diubah')}
function delLoc(id){const l=D.loc.find(x=>x.id==id);modal(`<h3>Hapus cabang ${esc(l.n)}?</h3><p>Stok cabang ini ikut dihapus dan akun staf yang hanya bertugas di sini akan kehilangan cabangnya. Riwayat transaksi lama tetap tersimpan.</p><button class="btn r" onclick="doDelLoc('${id}')">Hapus</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doDelLoc(id){const l=D.loc.find(x=>x.id==id);D.loc=D.loc.filter(x=>x.id!=id);delete D.bal[id];D.users.forEach(u=>{u.locs=u.locs.filter(x=>x!=id)});if(loc==id)loc=D.loc[0].id;aud('Hapus cabang',l.n);close();render();toast('Cabang dihapus')}
function askWipe(demo){modal(`<h3>${demo?'Kembalikan ke data demo?':'Hapus semua data demo?'}</h3><p>${demo?'Semua data saat ini diganti dengan data contoh.':'Produk, bahan, stok, transaksi, pengeluaran, transfer, dan riwayat kas akan dihapus. Akun dan cabang tetap ada.'} Tindakan ini tidak bisa dibatalkan. Ekspor CSV dulu bila perlu.</p><button class="btn r" onclick="doWipe(${demo})">Ya, lanjutkan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doWipe(demo){const u=D.users,l=D.loc,st=D.set;if(demo){D=seed();D.users=u;loc=D.loc[0].id}else{D=Object.assign(seed(),{ing:[],prod:[],bal:{},mv:[],sales:[],pur:[],tr:[],exp:[],shifts:[],aud:[],n:0,users:u,loc:l,set:st});D.loc.forEach(x=>{D.bal[x.id]={}})}cart=[];disc.v=0;close();save();toast(demo?'Data demo dikembalikan':'Semua data demo dihapus');go('dash')}
function askDelProd(id){const p=D.prod.find(x=>x.id==id);modal(`<h3>Hapus produk ${esc(p.n)}?</h3><p>Produk dan item stok miliknya akan dihapus. Riwayat transaksi lama tetap tersimpan.</p><button class="btn r" onclick="doDelProd('${id}')">Hapus</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doDelProd(id){const p=D.prod.find(x=>x.id==id);D.prod=D.prod.filter(x=>x.id!=id);if(!D.prod.some(x=>x.b==p.b)){D.ing=D.ing.filter(i=>i.id!=p.b);Object.keys(D.bal).forEach(l=>delete D.bal[l][p.b])}cart=[];aud('Hapus produk',p.n);close();render();toast('Produk dihapus')}
function set(){return `${demoWarn()}<div class="card"><b>Kebijakan</b><div class="f"><div><label for="sl">Batas diskon staf (%)</label><input id="sl" type="number" min="0" max="100" value="${D.set.lim}" onchange="D.set.lim=Math.min(100,Math.max(0,+this.value||0));aud('Ubah batas diskon',D.set.lim);toast('Disimpan')"></div><div><label for="sn">Izinkan stok negatif</label><select id="sn" onchange="D.set.neg=+this.value;aud('Ubah stok negatif',this.value);toast('Disimpan')"><option value="0">Tidak (default)</option><option value="1" ${D.set.neg?'selected':''}>Ya</option></select></div><div><label>Stok minimum</label><span class="mut">Atur lewat tabel di bawah</span></div></div>
<table><tr><th>Bahan</th><th>Stok minimum</th></tr>${D.ing.map(i=>`<tr><td>${i.n}</td><td><input type="number" min="0" value="${i.min}" style="width:110px" aria-label="Minimum ${i.n}" onchange="ing('${i.id}').min=Math.max(0,+this.value||0);aud('Ubah stok minimum','${i.n}');save()"> ${i.u}</td></tr>`).join('')}</table></div>
${usersH()}<div class="card sc"><b>Audit log (30 terakhir)</b><table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Objek</th><th>Alasan</th></tr>${D.aud.slice(0,30).map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.u)}</td><td>${a.a}</td><td>${esc(a.o)}</td><td>${esc(a.r)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Belum ada log.</td></tr>'}</table></div>
<div class="card"><b>Hapus data contoh</b><p class="mut">Menghapus semua produk, bahan, stok, transaksi, pengeluaran, transfer, dan riwayat kas agar Anda mulai dari kosong. Akun dan cabang tetap ada. Data tersimpan di browser perangkat ini saja.</p><button class="btn r" onclick="askWipe(0)">Hapus semua data</button></div>`}
login();
</script></body></html>
