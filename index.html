<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abu Iqbal POS</title>
<style>
:root{--bg:#FBF6E9;--card:#fff;--ink:#17150F;--mut:#6b6558;--y:#F5B800;--yd:#c99700;--ln:#e9e1cb;--ok:#1d7a46;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120c;--card:#1f1c13;--ink:#f6efd9;--mut:#a8a08a;--ln:#38331f;--ok:#4cc58a;--er:#ff8a80;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav{width:210px;background:#17150F;color:#FBF6E9;padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:20px;margin:0 8px 18px;letter-spacing:.5px}nav h1 span{color:var(--y)}
nav button{background:none;border:0;color:#d8d0b8;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;min-height:44px}
nav button.on{background:var(--y);color:#17150F;font-weight:700}nav button:hover:not(.on){background:#2a271c}
main{flex:1;padding:22px;min-width:0;max-width:1200px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.top h2{margin:0;flex:1;font-size:24px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.m{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}.m small{color:var(--mut);display:block}.m b{font-size:20px}
.btn{background:var(--y);color:#17150F;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.g{background:transparent;border:1px solid var(--ln);color:var(--ink);font-weight:500}.btn.r{background:var(--er);color:#fff}.btn:disabled{opacity:.5}
.btn.s{padding:6px 10px;min-height:34px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:44px;width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.sc{overflow-x:auto}.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--y);color:#17150F}
.badge.v{background:var(--er);color:#fff}.badge.o{background:var(--ok);color:#fff}.badge.n{background:var(--ln);color:var(--ink)}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px}.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.p{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}.p b{display:block;margin-bottom:6px}.sz{display:flex;gap:6px;flex-wrap:wrap}
.sz button{border:1px solid var(--ink);background:none;border-radius:8px;padding:7px 9px;cursor:pointer;min-height:40px;font-size:13px}.sz button:hover{background:var(--y);border-color:var(--y)}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.tot{font-size:22px;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--y);border-radius:6px 6px 0 0;min-height:3px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.md{background:var(--card);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;z-index:30;display:none;font-weight:600}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login h1{font-size:32px}.login h1 span{color:var(--yd)}
.err{color:var(--er);font-size:13px;margin-top:6px}.mut{color:var(--mut)}.mobnav{display:none}
@media(max-width:820px){.app{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;padding:10px;position:sticky;top:0;z-index:5}nav h1{display:none}nav button{white-space:nowrap}.pos{grid-template-columns:1fr}main{padding:14px}}
@media print{nav,.top,.noprint{display:none!important}.ov{position:static;background:none}}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID'),dt=d=>new Date(d).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}),
ld=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)},esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='abuiqbal_pos_v1';
function seed(){return{ing:[{id:'I1',n:'Bibit Oud Royal',u:'ml',min:50,c:3000},{id:'I2',n:'Bibit Musk Putih',u:'ml',min:50,c:2500},{id:'I3',n:'Bibit Amber Gold',u:'ml',min:50,c:2800},{id:'I4',n:'Alkohol',u:'ml',min:300,c:150},{id:'I5',n:'Botol 10 ml',u:'pcs',min:20,c:2000}],
loc:[{id:'L1',n:'Toko Utama'},{id:'L2',n:'Cabang 2'}],bal:{L1:{I1:300,I2:300,I3:300,I4:2000,I5:100},L2:{I1:100,I2:100,I3:100,I4:800,I5:40}},
prod:[{id:'P1',n:'Oud Royal',cat:'Woody',b:'I1',on:1,ppm:9000},{id:'P2',n:'Musk Putih',cat:'Floral',b:'I2',on:1,ppm:7000},{id:'P3',n:'Amber Gold',cat:'Oriental',b:'I3',on:1,ppm:8000}],
mv:[],sales:[],pur:[],tr:[],exp:[],aud:[],set:{lim:10,neg:0},n:0,users:[{u:'owner',n:'Pemilik',role:'owner',locs:[],ph:'43a0d17178a9d26c9e0fe9a74b0b45e38d32f27aed887a008a54bf6e033bf7b9'},{u:'kasir',n:'Kasir',role:'staff',locs:['L1'],ph:'f02b7c1e519e4fa436147f7e1399974f9510aa9c8e0cb8be29151eb540f9d214'}]}}
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=D||seed();if(!D.users)D.users=seed().users;D.prod.forEach(p=>{p.u=p.u||'ml';if(!p.ppm)p.ppm=p.sz?Math.round(p.sz[0].p/p.sz[0].ml):0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
async function hs(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const myLocs=()=>U.role=='owner'?D.loc:D.loc.filter(l=>U.locs.includes(l.id));
let U=null,loc='L1',pg='dash',cart=[],q='',disc={t:'%',v:0},R={f:ld().slice(0,8)+'01',t:ld(),d:'all',l:'all'};
const owner=()=>U.role==='owner',ing=id=>D.ing.find(i=>i.id==id),lname=id=>(D.loc.find(l=>l.id==id)||{}).n,bal=(l,i)=>(D.bal[l]||{})[i]||0;
function toast(m,ok=1){const t=$('#toast');t.textContent=m;t.style.background=ok?'#1d7a46':'#b3261e';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function aud(a,o,r=''){D.aud.unshift({t:Date.now(),u:U.n,a,o,r})}
function mv(l,i,qty,type,reason,ref=''){D.bal[l]=D.bal[l]||{};D.bal[l][i]=bal(l,i)+qty;D.mv.unshift({t:Date.now(),l,i,q:qty,type,reason,u:U.n,ref})}
function modal(h){$('#root').insertAdjacentHTML('beforeend',`<div class="ov" id="mo"><div class="md">${h}</div></div>`)}
const close=()=>{const m=$('#mo');m&&m.remove()};
const V=id=>$('#'+id).value,N=id=>parseFloat(V(id))||0;

/* ---------- Login ---------- */
function login(){$('#root').innerHTML=`<div class="login"><h1>Abu <span>Iqbal</span></h1><p class="mut">Sistem POS &amp; Inventori Refill Parfum</p><div class="card"><label for="lu">Akun</label><input id="lu" autocomplete="username"><br><br><label for="lp">Kata sandi</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><div class="err" id="le"></div><br><button class="btn" style="width:100%" onclick="doLogin()">Masuk</button></div><p class="mut" style="font-size:13px">Demo: <b>owner</b> / owner123 &nbsp;•&nbsp; <b>kasir</b> / kasir123</p></div>`}
async function doLogin(){const x=D.users.find(z=>z.u==V('lu').trim().toLowerCase());if(!x||x.ph!==await hs(V('lp'))){$('#le').textContent='Akun atau kata sandi salah.';return}const ls=x.role=='owner'?D.loc:D.loc.filter(l=>x.locs.includes(l.id));if(!ls.length){$('#le').textContent='Akun belum ditugaskan ke cabang mana pun. Hubungi owner.';return}U=x;loc=ls[0].id;pg=owner()?'dash':'pos';shell()}
const NAV=[['dash','Dashboard',1],['pos','Kasir'],['prod','Produk'],['inv','Inventori'],['pur','Pembelian',1],['tr','Transfer',1],['exp','Pengeluaran'],['rep','Laporan',1],['set','Pengaturan',1]];
function shell(){$('#root').innerHTML=`<div class="app"><nav><h1>Abu <span>Iqbal</span></h1>${NAV.filter(n=>!n[2]||owner()).map(n=>`<button class="${pg==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button style="margin-top:auto" onclick="U=null;login()">Keluar (${esc(U.n)})</button></nav><main id="pg"></main></div>`;render()}
const go=p=>{pg=p;shell()};
function lsel(all){return `<select aria-label="Lokasi" style="width:auto" onchange="${all?"R.l=this.value":"loc=this.value"};render()">${all?`<option value="all">Semua lokasi</option>`:''}${(all?D.loc:myLocs()).map(l=>`<option value="${l.id}" ${(all?R.l:loc)==l.id?'selected':''}>${l.n}</option>`).join('')}</select>`}
function render(){const t=NAV.find(n=>n[0]==pg)[1];$('#pg').innerHTML=`<div class="top"><h2>${t}</h2>${pg=='rep'?'':lsel(pg=='dash'&&0)}</div>`+({dash,pos,prod,inv,pur,tr,exp,rep,set})[pg]();save()}

/* ---------- Kalkulasi ---------- */
const ok=s=>s.status=='Selesai';
function calc(list){const s=list.filter(ok),g=s.reduce((a,x)=>a+x.gross,0),d=s.reduce((a,x)=>a+x.disc,0),h=s.reduce((a,x)=>a+x.hpp,0);return{n:s.length,g,d,dn:s.filter(x=>x.disc>0).length,net:g-d,h,gp:g-d-h}}
const inR=(x,f,t,l)=>{const d=new Date(x.t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);return d>=f&&d<=t&&(l=='all'||x.l==l)};
function dash(){const td=ld(),a=calc(D.sales.filter(x=>inR(x,td,td,loc))),m=calc(D.sales.filter(x=>inR(x,td.slice(0,8)+'01',td,loc))),ex=D.exp.filter(e=>e.d>=td.slice(0,8)+'01'&&e.l==loc).reduce((s,e)=>s+e.a,0);
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);return[k.slice(5),calc(D.sales.filter(x=>inR(x,k,k,loc))).net]}),mx=Math.max(1,...days.map(d=>d[1]));
const low=D.ing.filter(i=>bal(loc,i.id)<=i.min);
return `<p class="mut">Lokasi: <b>${lname(loc)}</b> • Hari ini ${td} • Bulan ini sejak ${td.slice(0,8)}01</p><div class="grid">
<div class="m"><small>Penjualan bersih hari ini</small><b>${rp(a.net)}</b></div><div class="m"><small>Transaksi hari ini</small><b>${a.n}</b></div><div class="m"><small>Diskon bulan ini (${m.dn} trx)</small><b>${rp(m.d)}</b></div>
<div class="m"><small>Penjualan bersih bulan ini</small><b>${rp(m.net)}</b></div><div class="m"><small>Laba kotor bulan ini</small><b>${rp(m.gp)}</b></div><div class="m"><small>Laba bersih bulan ini</small><b>${rp(m.gp-ex)}</b></div></div>
<div class="card"><b>Penjualan bersih 7 hari terakhir</b><div class="bars" style="margin-top:12px">${days.map(d=>`<div><i style="height:${d[1]/mx*100}px" title="${rp(d[1])}"></i>${d[0]}</div>`).join('')}</div></div>
<div class="card"><b>Stok menipis</b>${low.length?`<table>${low.map(i=>`<tr><td>${i.n}</td><td>${bal(loc,i.id)} ${i.u}</td><td><span class="badge v">⚠ Perlu dibeli (min ${i.min})</span></td></tr>`).join('')}</table>`:'<p class="mut">Semua stok aman.</p>'}</div>`}

/* ---------- Kasir ---------- */
function pos(){const ps=D.prod.filter(p=>p.on&&(p.n+p.cat).toLowerCase().includes(q.toLowerCase()));
return `<div class="pos"><div><label for="q">Cari parfum / kategori</label><input id="q" value="${esc(q)}" oninput="q=this.value;prodList()" placeholder="Ketik nama atau kategori…"><div class="prods" id="pl">${prodCards(ps)}</div></div><div class="card" id="cart">${cartH()}</div></div>`}
const prodCards=ps=>ps.length?ps.map(p=>`<div class="p"><b>${p.n}</b><span class="mut">${p.cat}</span><div style="margin:6px 0"><b style="display:inline">${rp(p.ppm)}</b> <span class="mut">/ ${p.u=='pcs'?'pcs':'ml'}</span>${p.u=='pcs'?`<span class="mut"> • stok ${bal(loc,p.b)}</span>`:''}</div><label for="ml_${p.id}">Jumlah ${p.u=='pcs'?'pcs':'ml'}</label><div style="display:flex;gap:6px"><input id="ml_${p.id}" type="number" min="0" step="any" inputmode="decimal" placeholder="${p.u=='pcs'?'mis. 1':'mis. 7.5'}" onkeydown="if(event.key=='Enter')add('${p.id}')"><button class="btn" aria-label="Tambah ke keranjang" onclick="add('${p.id}')">+</button></div></div>`).join(''):'<p class="mut">Produk tidak ditemukan.</p>';
function prodList(){$('#pl').innerHTML=prodCards(D.prod.filter(p=>p.on&&(p.n+p.cat).toLowerCase().includes(q.toLowerCase())))}
function add(pid){const p=D.prod.find(x=>x.id==pid),el=$('#ml_'+pid),v=parseFloat(el.value),pc=p.u=='pcs';if(!(v>0)||(pc&&!Number.isInteger(v)))return toast(pc?'Ketik jumlah pcs (bilangan bulat > 0)':'Ketik jumlah ml lebih dari 0',0);const c=cart.find(x=>x.pid==pid&&(pc||x.ml==v));if(pc){c?c.q+=v:cart.push({pid,ml:0,u:'pcs',p:p.ppm,q:v,n:p.n})}else{c?c.q++:cart.push({pid,ml:v,p:Math.round(v*p.ppm),q:1,n:p.n})}el.value='';$('#cart').innerHTML=cartH()}
const sub=()=>cart.reduce((a,c)=>a+c.p*c.q,0),dv=()=>Math.min(sub(),disc.t=='%'?sub()*disc.v/100:disc.v);
function cartH(){return `<b>Keranjang</b>${cart.length?cart.map((c,i)=>`<div class="row"><span>${c.n}${c.u=='pcs'?'':' '+c.ml+'ml'}<br><small class="mut">${rp(c.p)}</small></span><span style="white-space:nowrap"><button class="btn g s" aria-label="Kurangi" onclick="qty(${i},-1)">−</button> <b>${c.q}</b> <button class="btn g s" aria-label="Tambah" onclick="qty(${i},1)">+</button></span></div>`).join(''):'<p class="mut">Belum ada item. Pilih ukuran pada produk.</p>'}
<hr style="border:0;border-top:1px solid var(--ln)"><div class="f" style="grid-template-columns:90px 1fr"><div><label for="dt">Diskon</label><select id="dt" onchange="disc.t=this.value;$('#cart').innerHTML=cartH()"><option ${disc.t=='%'?'selected':''}>%</option><option ${disc.t=='Rp'?'selected':''} value="Rp">Rp</option></select></div><div><label for="dvv">Nilai</label><input id="dvv" type="number" min="0" value="${disc.v}" onchange="disc.v=Math.max(0,+this.value||0);$('#cart').innerHTML=cartH()"></div></div>
<div class="row"><span>Subtotal</span><span>${rp(sub())}</span></div><div class="row"><span>Diskon ${dv()>0?'<span class="badge">DISKON</span>':''}</span><span>− ${rp(dv())}</span></div><div class="row tot"><span>Total</span><span>${rp(sub()-dv())}</span></div>
<button class="btn" style="width:100%;margin-top:8px" ${cart.length?'':'disabled'} onclick="co()">Bayar</button> <button class="btn g" style="width:100%;margin-top:8px" onclick="cart=[];disc.v=0;$('#cart').innerHTML=cartH()">Kosongkan</button>`}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);$('#cart').innerHTML=cartH()}
function usage(){const u={};cart.forEach(c=>{const p=D.prod.find(x=>x.id==c.pid);if(p.u=='pcs'){u[p.b]=(u[p.b]||0)+c.q;return}const m=c.ml*c.q;u[p.b]=(u[p.b]||0)+m*.3;u.I4=(u.I4||0)+m*.7;u.I5=(u.I5||0)+c.q});return u}
function co(){const pct=disc.t=='%'?disc.v:dv()/sub()*100;if(!owner()&&pct>D.set.lim)return toast(`Diskon melebihi batas staf (${D.set.lim}%). Perlu persetujuan owner.`,0);
const u=usage();modal(`<h3>Pembayaran</h3><p class="row tot"><span>Total</span><span>${rp(sub()-dv())}</span></p><label for="pm">Metode</label><select id="pm" onchange="$('#cw').style.display=this.value=='Tunai'?'block':'none'"><option>Tunai</option><option>QRIS</option></select><div id="cw"><br><label for="cash">Uang diterima</label><input id="cash" type="number" min="0" oninput="$('#kb').textContent=rp(N('cash')-${sub()-dv()})"><p>Kembalian: <b id="kb">${rp(0)}</b></p></div>
<h4>Pemakaian bahan aktual (bisa diubah)</h4>${Object.keys(u).map(k=>`<div class="row"><label for="u_${k}" style="margin:0;align-self:center">${ing(k).n} (${ing(k).u})</label><input id="u_${k}" type="number" min="0" step="any" value="${+u[k].toFixed(2)}" style="width:110px"></div>`).join('')}<label for="nt">Catatan</label><input id="nt"><div id="ce" class="err"></div><br><button class="btn" onclick="pay()">Selesaikan transaksi</button> <button class="btn g" onclick="close()">Batal</button>`)}
let busy=0;
function pay(){if(busy)return;const total=sub()-dv(),m=V('pm'),keys=Object.keys(usage()),us={};keys.forEach(k=>us[k]=N('u_'+k));
if(keys.some(k=>us[k]<0))return $('#ce').textContent='Pemakaian tidak boleh negatif.';
if(m=='Tunai'&&N('cash')<total)return $('#ce').textContent='Uang diterima kurang dari total.';
const bad=keys.find(k=>!D.set.neg&&bal(loc,k)<us[k]);if(bad)return $('#ce').textContent=`Stok ${ing(bad).n} tidak cukup (tersisa ${bal(loc,bad)} ${ing(bad).u}).`;
busy=1;const id='TRX-'+ld().replace(/-/g,'')+'-'+String(++D.n).padStart(4,'0'),hpp=keys.reduce((a,k)=>a+us[k]*ing(k).c,0);
D.sales.unshift({id,t:Date.now(),l:loc,u:U.n,items:cart.map(c=>({...c})),gross:sub(),disc:dv(),net:total,pm:m,cash:m=='Tunai'?N('cash'):total,hpp,use:us,note:V('nt'),status:'Selesai'});
keys.forEach(k=>mv(loc,k,-us[k],'Pemakaian','Penjualan',id));aud('Transaksi',id);const s=D.sales[0];cart=[];disc.v=0;busy=0;close();save();receipt(s);render();toast('Transaksi berhasil')}
function receipt(s){modal(`<div style="font-family:monospace;font-size:13px"><h3 style="text-align:center;margin:0">ABU IQBAL</h3><p style="text-align:center;margin:0">${lname(s.l)}</p><hr><div>${s.id}<br>${dt(s.t)} • ${esc(s.u)}</div><hr>${s.items.map(i=>`<div class="row"><span>${i.n}${i.u=='pcs'?'':' '+i.ml+'ml'} x${i.q}</span><span>${rp(i.p*i.q)}</span></div>`).join('')}<hr><div class="row"><span>Subtotal</span><span>${rp(s.gross)}</span></div>${s.disc?`<div class="row"><span>DISKON</span><span>-${rp(s.disc)}</span></div>`:''}<div class="row"><b>TOTAL</b><b>${rp(s.net)}</b></div><div class="row"><span>${s.pm}${s.pm=='Tunai'?' diterima':''}</span><span>${rp(s.cash)}</span></div>${s.pm=='Tunai'?`<div class="row"><span>Kembali</span><span>${rp(s.cash-s.net)}</span></div>`:''}<p style="text-align:center">Terima kasih</p></div><div class="noprint"><button class="btn" onclick="print()">Cetak</button> <button class="btn g" onclick="close()">Tutup</button></div>`)}

/* ---------- Produk ---------- */
function prod(){return `${owner()?`<div class="card"><b>Tambah produk</b><div class="f"><div><label for="pn">Nama</label><input id="pn"></div><div><label for="pc">Kategori</label><input id="pc"></div><div><label for="pb">Bibit yang dipakai (khusus per ml)</label><select id="pb">${D.ing.filter(i=>/bibit/i.test(i.n)).map(i=>`<option value="${i.id}">${i.n}</option>`).join('')}</select></div><div><label for="pt">Jenis penjualan</label><select id="pt"><option value="ml">Per ml (parfum refill)</option><option value="pcs">Per pcs (barang)</option></select></div><div><label for="pm1">Harga jual (Rp per ml / per pcs)</label><input id="pm1" type="number" min="0" step="any"></div><div><label for="pcs1">Harga modal per pcs (khusus barang pcs)</label><input id="pcs1" type="number" min="0" step="any"></div><button class="btn" onclick="addProd()">Simpan</button></div><div id="pe" class="err"></div></div>`:''}
<div class="card sc"><table><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Status</th>${owner()?'<th></th>':''}</tr>${D.prod.map(p=>`<tr><td>${p.n}</td><td>${p.cat}</td><td>${rp(p.ppm)} / ${p.u=='pcs'?'pcs':'ml'}</td><td><span class="badge ${p.on?'o':'n'}">${p.on?'Aktif':'Nonaktif'}</span></td>${owner()?`<td><button class="btn g s" onclick="editPpm('${p.id}')">Ubah harga</button> <button class="btn g s" onclick="togProd('${p.id}')">${p.on?'Nonaktifkan':'Aktifkan'}</button></td>`:''}</tr>`).join('')}</table></div>`}
function addProd(){const n=V('pn').trim(),pp=N('pm1'),pc=V('pt')=='pcs';if(!n||pp<=0)return $('#pe').textContent='Isi nama dan harga jual (> 0).';let b=V('pb');if(pc){b='I'+Date.now();D.ing.push({id:b,n,u:'pcs',min:5,c:N('pcs1')});D.loc.forEach(l=>{D.bal[l.id]=D.bal[l.id]||{};D.bal[l.id][b]=0})}else if(!b)return $('#pe').textContent='Pilih bibit.';D.prod.push({id:'P'+Date.now(),n,cat:V('pc')||'-',b,on:1,u:pc?'pcs':'ml',ppm:pp});aud('Tambah produk',n);render();toast(pc?'Produk disimpan. Tambah stok lewat menu Pembelian.':'Produk disimpan')}
function editPpm(id){const p=D.prod.find(x=>x.id==id);modal(`<h3>Harga — ${p.n}</h3><label for="np">Harga baru (Rp / ${p.u=='pcs'?'pcs':'ml'})</label><input id="np" type="number" min="0" step="any" value="${p.ppm}"><div id="npe" class="err"></div><br><button class="btn" onclick="savePpm('${id}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function savePpm(id){const p=D.prod.find(x=>x.id==id),v=N('np');if(v<=0)return $('#npe').textContent='Harga harus lebih dari 0.';aud('Ubah harga/ml',p.n+': '+p.ppm+' → '+v);p.ppm=v;close();render();toast('Harga diperbarui')}
function togProd(id){const p=D.prod.find(x=>x.id==id);p.on=p.on?0:1;aud('Ubah status produk',p.n);render()}

/* ---------- Inventori ---------- */
function inv(){const mv_=D.mv.filter(m=>m.l==loc).slice(0,40);
return `<div class="card sc"><table><tr><th>Bahan</th><th>Saldo</th><th>Min</th><th>Status</th><th>HPP/unit</th>${owner()?'<th>Stok opname</th>':''}</tr>${D.ing.map(i=>{const b=bal(loc,i.id);return `<tr><td>${i.n}</td><td><b>${+b.toFixed(2)}</b> ${i.u}</td><td>${i.min}</td><td>${b<=i.min?'<span class="badge v">⚠ Menipis</span>':'<span class="badge o">✓ Aman</span>'}</td><td>${owner()?rp(i.c):'-'}</td>${owner()?`<td><button class="btn g s" onclick="opname('${i.id}')">Sesuaikan</button></td>`:''}</tr>`}).join('')}</table></div>
<div class="card"><b>Catat pemakaian bahan (di luar transaksi)</b><div class="f"><div><label for="ui">Bahan</label><select id="ui">${D.ing.map(i=>`<option value="${i.id}">${i.n} (${i.u})</option>`).join('')}</select></div><div><label for="uq">Jumlah</label><input id="uq" type="number" min="0" step="any"></div><div><label for="ur">Alasan</label><input id="ur" placeholder="mis. sampel/tester"></div><button class="btn" onclick="manUse()">Catat</button></div><div id="ie" class="err"></div></div>
<div class="card sc"><b>Riwayat pergerakan stok — ${lname(loc)} (40 terakhir)</b><table><tr><th>Waktu</th><th>Bahan</th><th>Jumlah</th><th>Jenis</th><th>Alasan</th><th>User</th><th>Ref</th></tr>${mv_.length?mv_.map(m=>`<tr><td>${dt(m.t)}</td><td>${ing(m.i).n}</td><td style="color:var(${m.q<0?'--er':'--ok'})">${m.q>0?'+':''}${+m.q.toFixed(2)}</td><td>${m.type}</td><td>${esc(m.reason)}</td><td>${esc(m.u)}</td><td>${m.ref}</td></tr>`).join(''):'<tr><td colspan="7" class="mut">Belum ada pergerakan.</td></tr>'}</table></div>`}
function manUse(){const i=V('ui'),qn=N('uq');if(qn<=0)return $('#ie').textContent='Jumlah harus lebih dari 0.';if(!V('ur').trim())return $('#ie').textContent='Alasan wajib diisi.';if(!D.set.neg&&bal(loc,i)<qn)return $('#ie').textContent='Stok tidak cukup.';mv(loc,i,-qn,'Pemakaian',V('ur'));aud('Pemakaian manual',ing(i).n+' '+qn,V('ur'));render();toast('Tercatat')}
function opname(id){const i=ing(id);modal(`<h3>Stok opname — ${i.n}</h3><p>Stok sistem: <b>${bal(loc,id)} ${i.u}</b></p><label for="ph">Stok fisik</label><input id="ph" type="number" min="0" step="any"><br><br><label for="pr">Alasan selisih (wajib)</label><input id="pr"><div id="oe" class="err"></div><br><button class="btn" onclick="doOp('${id}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doOp(id){const f=N('ph'),r=V('pr').trim();if(V('ph')===''||f<0)return $('#oe').textContent='Isi stok fisik yang valid.';if(!r)return $('#oe').textContent='Alasan wajib diisi.';const d=f-bal(loc,id);if(d)mv(loc,id,d,'Koreksi',r);aud('Stok opname',ing(id).n+' selisih '+d,r);close();render();toast('Stok dikoreksi')}

/* ---------- Pembelian ---------- */
function pur(){return `<div class="card"><b>Penerimaan pembelian baru</b><div class="f"><div><label for="pi">Bahan</label><select id="pi">${D.ing.map(i=>`<option value="${i.id}">${i.n} (${i.u})</option>`).join('')}</select></div><div><label for="pq">Jumlah</label><input id="pq" type="number" min="0" step="any"></div><div><label for="pp">Harga beli / unit</label><input id="pp" type="number" min="0"></div><div><label for="px">Biaya tambahan</label><input id="px" type="number" min="0" value="0"></div><div><label for="ps">Pemasok</label><input id="ps"></div><button class="btn" onclick="doPur()">Terima &amp; tambah stok</button></div><div id="pue" class="err"></div><p class="mut">HPP memakai rata-rata tertimbang (usulan PRD). Transaksi lama tidak berubah.</p></div>
<div class="card sc"><table><tr><th>Tanggal</th><th>Pemasok</th><th>Bahan</th><th>Jumlah</th><th>Total</th><th>Status</th></tr>${D.pur.slice(0,30).map(p=>`<tr><td>${dt(p.t)}</td><td>${esc(p.s)}</td><td>${ing(p.i).n}</td><td>${p.q}</td><td>${rp(p.tot)}</td><td><span class="badge o">${p.st}</span></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada pembelian.</td></tr>'}</table></div>`}
function doPur(){const i=V('pi'),qn=N('pq'),pr=N('pp'),x=N('px');if(qn<=0||pr<=0||x<0)return $('#pue').textContent='Jumlah dan harga harus lebih dari 0.';const I=ing(i),tot=D.loc.reduce((a,l)=>a+Math.max(0,bal(l.id,i)),0),nc=(tot*I.c+qn*pr+x)/(tot+qn);I.c=nc;mv(loc,i,qn,'Pembelian','Penerimaan pembelian');D.pur.unshift({t:Date.now(),l:loc,s:V('ps')||'-',i,q:qn,tot:qn*pr+x,st:'Diterima'});aud('Pembelian',I.n+' '+qn);render();toast('Stok bertambah')}

/* ---------- Transfer ---------- */
function tr(){const o=D.loc.filter(l=>l.id!=loc)[0];return `<div class="card"><b>Kirim stok dari ${lname(loc)}</b><div class="f"><div><label for="tt">Ke lokasi</label><select id="tt">${D.loc.filter(l=>l.id!=loc).map(l=>`<option value="${l.id}">${l.n}</option>`).join('')}</select></div><div><label for="ti">Bahan</label><select id="ti">${D.ing.map(i=>`<option value="${i.id}">${i.n}</option>`).join('')}</select></div><div><label for="tq">Jumlah</label><input id="tq" type="number" min="0" step="any"></div><button class="btn" onclick="doTr()">Kirim</button></div><div id="te" class="err"></div></div>
<div class="card sc"><table><tr><th>Waktu</th><th>Dari</th><th>Ke</th><th>Bahan</th><th>Jumlah</th><th>Status</th><th></th></tr>${D.tr.slice(0,30).map(t=>`<tr><td>${dt(t.t)}</td><td>${lname(t.f)}</td><td>${lname(t.to)}</td><td>${ing(t.i).n}</td><td>${t.q}</td><td><span class="badge ${t.st=='Diterima'?'o':''}">${t.st}</span></td><td>${t.st=='Dikirim'?`<button class="btn s" onclick="recv('${t.id}')">Konfirmasi terima</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Belum ada transfer.</td></tr>'}</table></div>`}
function doTr(){const i=V('ti'),qn=N('tq');if(qn<=0)return $('#te').textContent='Jumlah harus lebih dari 0.';if(bal(loc,i)<qn)return $('#te').textContent='Stok asal tidak cukup.';const id='T'+Date.now();mv(loc,i,-qn,'Transfer keluar','Ke '+lname(V('tt')),id);D.tr.unshift({id,t:Date.now(),f:loc,to:V('tt'),i,q:qn,st:'Dikirim'});aud('Transfer kirim',ing(i).n+' '+qn);render();toast('Transfer dikirim')}
function recv(id){const t=D.tr.find(x=>x.id==id);if(t.st!='Dikirim')return;t.st='Diterima';mv(t.to,t.i,t.q,'Transfer masuk','Dari '+lname(t.f),id);aud('Transfer terima',id);render();toast('Stok diterima')}

/* ---------- Pengeluaran ---------- */
function exp(){return `<div class="card"><b>Catat pengeluaran — ${lname(loc)}</b><div class="f"><div><label for="ec">Kategori</label><select id="ec"><option>Sewa</option><option>Listrik</option><option>Transportasi</option><option>Perlengkapan</option><option>Lainnya</option></select></div><div><label for="ea">Nominal</label><input id="ea" type="number" min="0"></div><div><label for="ed">Tanggal</label><input id="ed" type="date" value="${ld()}"></div><div><label for="en">Alasan (wajib)</label><input id="en" placeholder="mis. beli plastik pembungkus"></div><button class="btn" onclick="doExp()">Simpan</button></div><div id="ee" class="err"></div></div>
<div class="card sc"><table><tr><th>Tanggal</th><th>Lokasi</th><th>Kategori</th><th>Nominal</th><th>Alasan</th><th>Dicatat oleh</th></tr>${D.exp.filter(e=>owner()||e.u==U.n).slice(0,40).map(e=>`<tr><td>${e.d}</td><td>${lname(e.l)}</td><td>${e.c}</td><td>${rp(e.a)}</td><td>${esc(e.n)}</td><td>${esc(e.u||'-')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada pengeluaran.</td></tr>'}</table></div>`}
function doExp(){const a=N('ea');if(a<=0||!V('ed'))return $('#ee').textContent='Nominal harus > 0 dan tanggal wajib diisi.';if(!V('en').trim())return $('#ee').textContent='Alasan pengeluaran wajib diisi.';D.exp.unshift({d:V('ed'),l:loc,c:V('ec'),a,n:V('en').trim(),u:U.n});aud('Pengeluaran',V('ec')+' '+a,V('en').trim());D.exp.sort((x,y)=>y.d.localeCompare(x.d));render();toast('Tersimpan')}

/* ---------- Laporan ---------- */
function rep(){const L=D.sales.filter(x=>inR(x,R.f,R.t,R.l)&&(R.d=='all'||(R.d=='y'?x.disc>0:x.disc==0))),c=calc(L),ex=D.exp.filter(e=>e.d>=R.f&&e.d<=R.t&&(R.l=='all'||e.l==R.l)).reduce((s,e)=>s+e.a,0),pm={};L.filter(ok).forEach(x=>pm[x.pm]=(pm[x.pm]||0)+x.net);
return `<div class="card"><div class="f"><div><label for="rf">Dari</label><input id="rf" type="date" value="${R.f}" onchange="R.f=this.value;render()"></div><div><label for="rt">Sampai</label><input id="rt" type="date" value="${R.t}" onchange="R.t=this.value;render()"></div><div><label>Lokasi</label>${lsel(1)}</div><div><label for="rd">Status diskon</label><select id="rd" onchange="R.d=this.value;render()"><option value="all">Semua transaksi</option><option value="y" ${R.d=='y'?'selected':''}>Berdiskon</option><option value="n" ${R.d=='n'?'selected':''}>Tanpa diskon</option></select></div><button class="btn g" onclick="csv()">Ekspor CSV</button></div></div>
<p class="mut">Periode ${R.f} s/d ${R.t} • ${R.l=='all'?'Semua lokasi':lname(R.l)} • Transaksi void tidak dihitung</p><div class="grid">
<div class="m"><small>Omzet kotor</small><b>${rp(c.g)}</b></div><div class="m"><small>Total diskon (${c.dn} dari ${c.n} trx${c.n?', '+Math.round(c.dn/c.n*100)+'%':''})</small><b>${rp(c.d)}</b></div><div class="m"><small>Penjualan bersih</small><b>${rp(c.net)}</b></div><div class="m"><small>HPP</small><b>${rp(c.h)}</b></div><div class="m"><small>Laba kotor</small><b>${rp(c.gp)}</b></div><div class="m"><small>Pengeluaran operasional</small><b>${rp(ex)}</b></div><div class="m"><small>Laba bersih operasional</small><b>${rp(c.gp-ex)}</b></div>${Object.keys(pm).map(k=>`<div class="m"><small>Pembayaran ${k}</small><b>${rp(pm[k])}</b></div>`).join('')}</div>
<div class="card sc"><table><tr><th>No. transaksi</th><th>Waktu</th><th>Lokasi</th><th>Kasir</th><th>Bayar</th><th>Sebelum diskon</th><th>Diskon</th><th>Bersih</th><th>HPP</th><th>Status</th><th></th></tr>${L.slice(0,60).map(s=>`<tr><td>${s.id}</td><td>${dt(s.t)}</td><td>${lname(s.l)}</td><td>${esc(s.u)}</td><td>${s.pm}</td><td>${rp(s.gross)}</td><td>${s.disc?`<span class="badge">DISKON</span> ${rp(s.disc)}`:'-'}</td><td>${rp(s.net)}</td><td>${rp(s.hpp)}</td><td><span class="badge ${ok(s)?'o':'v'}">${s.status}</span></td><td><button class="btn g s" onclick="receipt(D.sales.find(x=>x.id=='${s.id}'))">Struk</button> ${ok(s)?`<button class="btn r s" onclick="voidS('${s.id}')">Void</button>`:''}</td></tr>`).join('')||'<tr><td colspan="11" class="mut">Tidak ada transaksi pada filter ini.</td></tr>'}</table></div>`}
function voidS(id){modal(`<h3>Void ${id}</h3><p>Stok pemakaian akan dikembalikan dan transaksi tidak dihitung di laporan. Tindakan ini tercatat.</p><label for="vr">Alasan (wajib)</label><input id="vr"><div id="ve" class="err"></div><br><button class="btn r" onclick="doVoid('${id}')">Void transaksi</button> <button class="btn g" onclick="close()">Batal</button>`)}
function doVoid(id){const r=V('vr').trim();if(!r)return $('#ve').textContent='Alasan wajib diisi.';const s=D.sales.find(x=>x.id==id);if(!ok(s))return;s.status='Void';Object.keys(s.use).forEach(k=>mv(s.l,k,s.use[k],'Reversal','Void '+id,id));aud('Void',id,r);close();render();toast('Transaksi di-void')}
function csv(){const L=D.sales.filter(x=>inR(x,R.f,R.t,R.l)),r=[['No','Waktu','Lokasi','Kasir','Bayar','Gross','Diskon','Net','HPP','Status'],...L.map(s=>[s.id,new Date(s.t).toISOString(),lname(s.l),s.u,s.pm,s.gross,s.disc,s.net,s.hpp,s.status])];const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.map(x=>x.join(',')).join('\n'));a.download='laporan-abu-iqbal.csv';a.click()}

/* ---------- Pengaturan ---------- */
const lchk=(s=[])=>D.loc.map(l=>`<label style="display:inline-flex;gap:6px;align-items:center;margin-right:12px;color:var(--ink)"><input type="checkbox" class="lc" value="${l.id}" style="width:auto;min-height:0" ${s.includes(l.id)?'checked':''}>${l.n}</label>`).join(''),sel=s=>[...document.querySelectorAll(s+' .lc:checked')].map(c=>c.value);
function usersH(){return `<div class="card"><b>Cabang</b><div class="f"><div><label for="ln">Nama cabang baru</label><input id="ln"></div><button class="btn" onclick="addLoc()">Tambah cabang</button></div><div id="lerr" class="err"></div><p class="mut">Cabang saat ini: ${D.loc.map(l=>l.n).join(', ')}</p></div>
<div class="card sc"><b>Akun pengguna</b><div class="f"><div><label for="an">Nama</label><input id="an"></div><div><label for="au">Username</label><input id="au" autocomplete="off"></div><div><label for="ap">Kata sandi (min. 6)</label><input id="ap" type="password" autocomplete="new-password"></div><div><label for="ar">Peran</label><select id="ar"><option value="staff">Staff / Kasir</option><option value="owner">Owner</option></select></div></div><p id="lcf"><label>Cabang yang boleh diakses (untuk staff)</label>${lchk()}</p><button class="btn" onclick="addUser()">Tambah akun</button><div id="aerr" class="err"></div>
<table style="margin-top:12px"><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Cabang</th><th></th></tr>${D.users.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.u)}</td><td>${x.role=='owner'?'Owner':'Staff'}</td><td>${x.role=='owner'?'Semua':x.locs.map(l=>lname(l)).join(', ')||'<span class="badge v">Belum ada</span>'}</td><td>${x.role=='staff'?`<button class="btn g s" onclick="editLocs('${x.u}')">Atur cabang</button> `:''}<button class="btn g s" onclick="resetPw('${x.u}')">Reset sandi</button>${x.u!=U.u?` <button class="btn r s" onclick="delUser('${x.u}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div>`}
function addLoc(){const n=V('ln').trim();if(!n)return $('#lerr').textContent='Nama cabang wajib diisi.';if(D.loc.some(l=>l.n.toLowerCase()==n.toLowerCase()))return $('#lerr').textContent='Nama cabang sudah ada.';const id='L'+Date.now();D.loc.push({id,n});D.bal[id]={};aud('Tambah cabang',n);render();toast('Cabang ditambahkan')}
async function addUser(){const e=m=>{$('#aerr').textContent=m},n=V('an').trim(),u=V('au').trim().toLowerCase(),p=V('ap'),r=V('ar'),l=sel('#lcf');if(!n||!u)return e('Nama dan username wajib diisi.');if(!/^[a-z0-9._]+$/.test(u))return e('Username hanya huruf kecil, angka, titik, atau garis bawah.');if(p.length<6)return e('Kata sandi minimal 6 karakter.');if(D.users.some(x=>x.u==u))return e('Username sudah dipakai.');if(r=='staff'&&!l.length)return e('Pilih minimal satu cabang untuk staff.');D.users.push({u,n,role:r,locs:r=='staff'?l:[],ph:await hs(p)});aud('Tambah akun',u+' ('+r+')');render();toast('Akun ditambahkan')}
function editLocs(u){const x=D.users.find(z=>z.u==u);modal(`<h3>Cabang untuk ${esc(x.n)}</h3><p>${lchk(x.locs)}</p><div id="me" class="err"></div><button class="btn" onclick="saveLocs('${u}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
function saveLocs(u){const l=sel('#mo');if(!l.length)return $('#me').textContent='Pilih minimal satu cabang.';D.users.find(z=>z.u==u).locs=l;aud('Ubah cabang akun',u,l.map(x=>lname(x)).join(', '));close();render();toast('Cabang diperbarui')}
function resetPw(u){modal(`<h3>Reset sandi ${esc(u)}</h3><label for="np2">Kata sandi baru (min. 6)</label><input id="np2" type="password" autocomplete="new-password"><div id="me" class="err"></div><br><button class="btn" onclick="savePw('${u}')">Simpan</button> <button class="btn g" onclick="close()">Batal</button>`)}
async function savePw(u){const p=V('np2');if(p.length<6)return $('#me').textContent='Minimal 6 karakter.';D.users.find(z=>z.u==u).ph=await hs(p);aud('Reset sandi',u);close();save();toast('Kata sandi diganti')}
function delUser(u){modal(`<h3>Hapus akun ${esc(u)}?</h3><p>Riwayat transaksinya tetap tersimpan.</p><button class="btn r" onclick="D.users=D.users.filter(z=>z.u!='${u}');aud('Hapus akun','${u}');close();render();toast('Akun dihapus')">Hapus</button> <button class="btn g" onclick="close()">Batal</button>`)}

<table><tr><th>Bahan</th><th>Stok minimum</th></tr>${D.ing.map(i=>`<tr><td>${i.n}</td><td><input type="number" min="0" value="${i.min}" style="width:110px" aria-label="Minimum ${i.n}" onchange="ing('${i.id}').min=Math.max(0,+this.value||0);aud('Ubah stok minimum','${i.n}');save()"> ${i.u}</td></tr>`).join('')}</table></div>
